<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Sidekick 3D Overlay</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font-family: "Segoe UI", system-ui, sans-serif; }
  canvas { display: block; }
  #bubble {
    position: absolute; left: 50%; top: 8px; max-width: 90%; padding: 11px 15px; border-radius: 18px; background: #fff; color: #1b1630;
    font-size: 19px; font-weight: 600; line-height: 1.25; box-shadow: 0 6px 18px rgba(0,0,0,.35);
    opacity: 0; transform: translate(-50%, -6px) scale(.96); transition: opacity .2s, transform .2s; pointer-events: none; box-sizing: border-box;
  }
  #bubble::after { content: ""; position: absolute; left: 50%; bottom: -10px; margin-left: -10px; border: 10px solid transparent; border-bottom: 0; border-top-color: #fff; }
  #bubble.show { opacity: 1; transform: translate(-50%, 0); }
  #unlock { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); padding: 6px 10px; border-radius: 8px;
    background: #000c; color: #fff; font-size: 13px; cursor: pointer; display: none; }
</style>
<script type="importmap">
{ "imports": {
  "three": "./lib/three/build/three.module.min.js",
  "three/addons/": "./lib/three/examples/jsm/",
  "@pixiv/three-vrm": "./lib/three-vrm/three-vrm.module.min.js"
} }
</script>
</head>
<body>
<div id="bubble"></div>
<div id="unlock">Click to enable sound (not needed inside OBS)</div>

<script type="module">
import * as THREE from "three";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { mergeGeometries } from "three/addons/utils/BufferGeometryUtils.js";

// URL options:  ?cap=TEXT  ?demo=1  ?mode=stay|wander|roam|walkon  ?home=0.7,0  ?size=1  ?scale=1  ?wander=0  ?vrm=0  ?bg=#4a7fb5  ?yaw=0.6
const params = new URLSearchParams(location.search);
const CAP_TEXT = params.get("cap") ?? "COCK";
const DEMO = params.has("demo");
let botName = params.get("name") || "Gary";   // replaced by the app's [bot] name on connect
const ZOOM = parseFloat(params.get("scale") || "1");
if (params.get("bg")) document.documentElement.style.background = params.get("bg");

// ------------------------------------------------------------ helpers
const lerp = (a, b, k) => a + (b - a) * k;
const clamp = THREE.MathUtils.clamp;
const smooth = (cur, target, rate, dt) => cur + (target - cur) * (1 - Math.exp(-rate * dt));
const lerpAngle = (a, b, k) => { let d = (b - a) % (Math.PI * 2); if (d > Math.PI) d -= Math.PI * 2; if (d < -Math.PI) d += Math.PI * 2; return a + d * k; };
const rand = (a = 0, b = 1) => a + Math.random() * (b - a);
function seeded(seed) { return () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646; }
const rnd = seeded(1337);                       // deterministic: he looks the same every load
class Spring {                                   // damped spring for secondary motion (cap bob, hair sway, nods)
  constructor(k = 60, d = 8) { this.k = k; this.d = d; this.x = 0; this.v = 0; }
  update(dt, target = 0, kick = 0) {
    this.v += (-this.k * (this.x - target) - this.d * this.v) * dt + kick;
    this.x += this.v * dt;
    return this.x;
  }
}

// ------------------------------------------------------------ renderer, camera, lights
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: DEMO });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0x000000, 0);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.5;

const camera = new THREE.PerspectiveCamera(26, 1, 0.1, 80);
const stage = { wide: false, zNear: 0.3, zFar: -0.3, zMid: 0 };
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  stage.wide = camera.aspect > 1.25;
  const vfov = THREE.MathUtils.degToRad(camera.fov);
  let dist;
  if (stage.wide) {
    // full-screen stage: he is ~40% of the screen height in the middle of the stage, bigger up close, smaller far back
    const fitH = 5.1 / ZOOM;
    dist = fitH / 2 / Math.tan(vfov / 2);
    camera.position.set(0, 2.8, dist);
    camera.lookAt(0, 0.95, 0);
  } else {
    // small square source: keep the whole character (plus thought bubble) in frame
    const fitH = 3.3 / ZOOM, fitW = 3.0 / ZOOM;
    dist = Math.max(fitH / 2 / Math.tan(vfov / 2), fitW / 2 / Math.tan(vfov / 2) / camera.aspect);
    camera.position.set(0, 2.45, dist);
    camera.lookAt(0, 1.22, 0);
  }
  camera.updateProjectionMatrix();
  camera.updateMatrixWorld();
  computeStage();
  bubble.style.maxWidth = stage.wide ? Math.min(520, w * 0.4) + "px" : "90%";
  bubble.style.fontSize = stage.wide ? "22px" : "19px";
}
// where on the ground he can stand and still be on screen
const _p = new THREE.Vector3();
function ndc(x, y, z) { return _p.set(x, y, z).project(camera); }
function xMaxAt(z, size = 1) {       // largest |x| at depth z where feet and cap top are inside the frame
  let m = Infinity;
  for (const y of [0, 2.45 * size]) {
    _p.set(0, y, z).applyMatrix4(camera.matrixWorldInverse);
    const zv = -_p.z;
    m = Math.min(m, 0.97 * zv / camera.projectionMatrix.elements[0]);
  }
  return m;
}
function computeStage() {
  let zNear = -Infinity, zFar = Infinity;
  const size = settings.size, topY = 2.55 * size, topLimit = stage.wide ? 0.84 : 0.985;
  for (let z = camera.position.z - 1.5; z >= -14; z -= 0.1) {
    const feet = ndc(0, 0, z).y, top = ndc(0, topY, z).y;
    const visible = feet > -0.985 && top < topLimit;
    if (visible && zNear === -Infinity) zNear = z;                 // closest he can come
    if (visible && (top - feet) >= (stage.wide ? 0.42 : 1.1) * Math.min(1, size)) zFar = z;   // furthest before he gets too small
  }
  if (zNear === -Infinity) { zNear = 0.2; zFar = -0.2; }
  stage.zNear = zNear - 0.15; stage.zFar = Math.min(zFar, zNear - 0.3); stage.zMid = (stage.zNear + stage.zFar) / 2;
}

const hemi = new THREE.HemisphereLight(0xdfefff, 0x6b5a48, 0.85);
scene.add(hemi);
const key = new THREE.DirectionalLight(0xfff1dc, 2.3);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -3; key.shadow.camera.right = 3; key.shadow.camera.top = 3.5; key.shadow.camera.bottom = -1.5;
key.shadow.camera.near = 0.5; key.shadow.camera.far = 20;
key.shadow.bias = -0.0004; key.shadow.normalBias = 0.025; key.shadow.radius = 5;
scene.add(key); scene.add(key.target);
const rim = new THREE.DirectionalLight(0xbfe0ff, 1.5);
scene.add(rim); scene.add(rim.target);
const fill = new THREE.DirectionalLight(0xffd6c0, 0.55);
scene.add(fill); scene.add(fill.target);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.ShadowMaterial({ opacity: 0.3 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// ------------------------------------------------------------ procedural textures
function canvasTex(w, h, draw, srgb = true) {
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  draw(c.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  t.userData.canvas = c; t.userData.ctx = c.getContext("2d");
  return t;
}

// red felt cap with fuzzy white letters and six panel seams, mapped onto the dome (u=0.25 is the front)
const capTex = canvasTex(1024, 512, (g, w, h) => {
  g.fillStyle = "#df1219"; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 14000; i++) {           // felt fibres
    g.fillStyle = `hsla(${356 + rnd() * 7}, 90%, ${36 + rnd() * 22}%, .3)`;
    g.fillRect(rnd() * w, rnd() * h, 1.5 + rnd() * 2.5, 5 + rnd() * 12);
  }
  // soft shading creases
  g.globalAlpha = 0.18;
  for (let i = 0; i < 18; i++) {
    const x = rnd() * w, y = rnd() * h, r = 60 + rnd() * 140;
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, rnd() > 0.5 ? "#ff6a60" : "#7a0008"); gr.addColorStop(1, "rgba(0,0,0,0)");
    g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2);
  }
  g.globalAlpha = 1;
  // panel seams: six panels, none through the front
  g.strokeStyle = "rgba(90,0,6,.55)"; g.lineWidth = 3;
  for (let k = 0; k < 6; k++) {
    const u = ((0.25 + (k + 0.5) / 6) % 1) * w;
    g.beginPath(); g.moveTo(u, 0); g.lineTo(u, h); g.stroke();
    g.setLineDash([6, 7]); g.strokeStyle = "rgba(255,180,170,.35)"; g.lineWidth = 1.5;
    g.beginPath(); g.moveTo(u + 4, 0); g.lineTo(u + 4, h); g.stroke();
    g.setLineDash([]); g.strokeStyle = "rgba(90,0,6,.55)"; g.lineWidth = 3;
  }
  // fuzzy spray-stencil letters on the front panel
  g.save();
  g.translate(w * 0.25, h * 0.70);
  g.scale(1, 1.3);
  const px = Math.min(116, 560 / Math.max(1, CAP_TEXT.length) * 1.45);
  g.font = `900 ${px}px 'Arial Rounded MT Bold', 'Arial Black', 'Segoe UI Black', Impact, sans-serif`;
  g.textAlign = "center"; g.textBaseline = "middle"; g.lineJoin = "round";
  g.shadowColor = "rgba(255,255,255,.9)"; g.shadowBlur = 22;
  g.fillStyle = "#fff"; for (let i = 0; i < 3; i++) g.fillText(CAP_TEXT, 0, 0);
  g.shadowBlur = 0;
  g.strokeStyle = "rgba(255,255,255,.55)"; g.lineWidth = 9;
  for (let i = 0; i < 14; i++) g.strokeText(CAP_TEXT, (rnd() - 0.5) * 7, (rnd() - 0.5) * 5);
  g.fillStyle = "#ffffff"; g.fillText(CAP_TEXT, 0, 0);
  g.restore();
});

const skinTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = "#f3c6a2"; g.fillRect(0, 0, w, h);
  g.globalAlpha = .06;
  for (let i = 0; i < 5000; i++) { g.fillStyle = rnd() > .5 ? "#c98a63" : "#fff2e2"; g.fillRect(rnd() * w, rnd() * h, 2, 2); }
});

const shirtTex = canvasTex(256, 512, (g, w, h) => {   // v runs bottom (hem) to top (collar)
  g.fillStyle = "#17313f"; g.fillRect(0, 0, w, h);
  for (let y = 26; y < h; y += 44) {
    g.fillStyle = "#4cc96a"; g.fillRect(0, y, w, 16);
    g.fillStyle = "#2a8c48"; g.fillRect(0, y + 16, w, 4);
    g.fillStyle = "#8fe39f"; g.fillRect(0, y, w, 3);
  }
  g.globalAlpha = .1;
  for (let i = 0; i < 6000; i++) { g.fillStyle = rnd() > .5 ? "#fff" : "#000"; g.fillRect(rnd() * w, rnd() * h, 1, 2); }
  g.globalAlpha = 1;
  g.fillStyle = "#101c26"; g.fillRect(0, 0, w, 20);               // collar band
});
shirtTex.wrapS = THREE.RepeatWrapping; shirtTex.wrapT = THREE.ClampToEdgeWrapping;

const denimTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = "#2e4d7d"; g.fillRect(0, 0, w, h);
  g.globalAlpha = .18;
  for (let i = 0; i < 9000; i++) { g.fillStyle = rnd() > .5 ? "#9ab4d8" : "#122540"; g.fillRect(rnd() * w, rnd() * h, 1, 3); }
  g.globalAlpha = 1;
  g.strokeStyle = "#d9a648"; g.lineWidth = 2; g.setLineDash([5, 4]);
  g.beginPath(); g.moveTo(w * 0.5, 0); g.lineTo(w * 0.5, h); g.stroke();
});
denimTex.wrapS = denimTex.wrapT = THREE.RepeatWrapping; denimTex.repeat.set(2, 1);

const fuzzBump = canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = "#808080"; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 25000; i++) { g.fillStyle = rnd() > .5 ? "#ffffff30" : "#00000030"; g.fillRect(rnd() * w, rnd() * h, 1 + rnd() * 2, 1 + rnd() * 2); }
}, false);
fuzzBump.wrapS = fuzzBump.wrapT = THREE.RepeatWrapping; fuzzBump.repeat.set(4, 2);

const smokeTex = canvasTex(64, 64, (g) => {
  const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, "rgba(240,240,245,.85)"); gr.addColorStop(.45, "rgba(225,225,232,.35)"); gr.addColorStop(1, "rgba(225,225,232,0)");
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
});

// ------------------------------------------------------------ fur: shell layers rendered as one instanced mesh with a strand shader
const FUR_VERT = /* glsl */`
  attribute float aShell;
  varying float vShell; varying vec3 vFurPos;
  uniform float uLen, uTime, uWind; uniform vec3 uGrav;`;
const FUR_VERT_BODY = /* glsl */`
  vShell = aShell; vFurPos = position;
  {
    float h = aShell;
    vec3 n = normalize(objectNormal);
    vec3 d = n * (uLen * h) + uGrav * (uLen * h * h);
    d += uWind * vec3(sin(uTime * 1.9 + position.y * 7.0), 0.0, cos(uTime * 1.4 + position.x * 6.0)) * (uLen * h * h);
    transformed += d;
  }`;
const FUR_FRAG = /* glsl */`
  varying float vShell; varying vec3 vFurPos;
  uniform float uDensity, uRoot, uTip, uThick;
  vec3 furHash(vec3 p) { p = fract(p * vec3(.1031, .1030, .0973)); p += dot(p, p.yxz + 33.33); return fract((p.xxy + p.yxx) * p.zyx); }
  float furStrand(vec3 p, out float len) {
    vec3 c = floor(p), f = fract(p);
    vec3 s = step(0.5, f) * 2.0 - 1.0;
    float best = 0.0; len = 1.0;
    for (int i = 0; i < 8; i++) {
      vec3 o = vec3(float(i & 1), float((i >> 1) & 1), float((i >> 2) & 1)) * s;
      vec3 r = furHash(c + o);
      float v = 1.0 - length(o + r - f) / uThick;
      if (v > best) { best = v; len = 0.55 + 0.45 * r.x; }
    }
    return best;
  }`;
const FUR_FRAG_BODY = /* glsl */`
  {
    float sl; float s = furStrand(vFurPos * uDensity, sl);
    if (s < vShell / sl) discard;
    diffuseColor.rgb *= mix(uRoot, uTip, vShell);
  }`;
const furObjects = [];
function makeFur(geo, baseMat, o = {}) {
  const layers = o.layers ?? 16;
  const g = geo.clone();
  const sh = new Float32Array(layers);
  for (let i = 0; i < layers; i++) sh[i] = (i + 1) / layers;
  g.setAttribute("aShell", new THREE.InstancedBufferAttribute(sh, 1));
  const mat = baseMat.clone();
  const U = {
    uLen: { value: o.length ?? 0.05 }, uGrav: { value: new THREE.Vector3(0, -(o.gravity ?? 0.35), 0) },
    uDensity: { value: o.density ?? 60 }, uRoot: { value: o.root ?? 0.55 }, uTip: { value: o.tip ?? 1.08 },
    uThick: { value: o.thick ?? 0.9 }, uTime: { value: 0 }, uWind: { value: o.wind ?? 0 },
  };
  mat.onBeforeCompile = s => {
    Object.assign(s.uniforms, U);
    s.vertexShader = s.vertexShader.replace("#include <common>", "#include <common>\n" + FUR_VERT)
      .replace("#include <begin_vertex>", "#include <begin_vertex>\n" + FUR_VERT_BODY);
    s.fragmentShader = s.fragmentShader.replace("#include <common>", "#include <common>\n" + FUR_FRAG)
      .replace("#include <map_fragment>", "#include <map_fragment>\n" + FUR_FRAG_BODY);
  };
  mat.customProgramCacheKey = () => "fur1";
  const im = new THREE.InstancedMesh(g, mat, layers);
  const id = new THREE.Matrix4();
  for (let i = 0; i < layers; i++) im.setMatrixAt(i, id);
  im.castShadow = false; im.receiveShadow = true; im.frustumCulled = false;
  im.userData.fur = { U, gravity: o.gravity ?? 0.35 };
  furObjects.push(im);
  return im;
}
const _q = new THREE.Quaternion();
function updateFur(t) {
  for (const im of furObjects) {
    const f = im.userData.fur;
    f.U.uTime.value = t;
    im.getWorldQuaternion(_q).invert();          // gravity always pulls down in world space
    f.U.uGrav.value.set(0, -f.gravity, 0).applyQuaternion(_q);
  }
}

// ------------------------------------------------------------ materials
const M = {
  skin: new THREE.MeshPhysicalMaterial({ map: skinTex, roughness: 0.58, sheen: 0.55, sheenColor: new THREE.Color(0xffb89a), sheenRoughness: 0.5 }),
  cap: new THREE.MeshStandardMaterial({ map: capTex, roughness: 1, bumpMap: fuzzBump, bumpScale: 1.5 }),
  capPlain: new THREE.MeshStandardMaterial({ color: 0xd8111a, roughness: 1, bumpMap: fuzzBump, bumpScale: 1.5 }),
  brim: new THREE.MeshStandardMaterial({ color: 0xcf0f18, roughness: 1, bumpMap: fuzzBump, bumpScale: 1.5 }),
  hair: new THREE.MeshStandardMaterial({ color: 0x5a3418, roughness: 0.85, bumpMap: fuzzBump, bumpScale: 2 }),
  stache: new THREE.MeshStandardMaterial({ color: 0x3f2310, roughness: 0.9 }),
  face: null,
  cornea: new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0.06, clearcoat: 1, transparent: true, opacity: 0.16, depthWrite: false }),
  shirt: new THREE.MeshStandardMaterial({ map: shirtTex, roughness: 0.9, bumpMap: fuzzBump, bumpScale: 0.4 }),
  jeans: new THREE.MeshStandardMaterial({ map: denimTex, roughness: 0.95 }),
  shoe: new THREE.MeshStandardMaterial({ color: 0xf2f0ea, roughness: 0.55 }),
  shoeTrim: new THREE.MeshStandardMaterial({ color: 0xc8202a, roughness: 0.6 }),
  sole: new THREE.MeshStandardMaterial({ color: 0x3a3a40, roughness: 0.8 }),
  paper: new THREE.MeshStandardMaterial({ color: 0xfbfbf6, roughness: 0.6 }),
  filter: new THREE.MeshStandardMaterial({ color: 0xe0913a, roughness: 0.6 }),
  ash: new THREE.MeshStandardMaterial({ color: 0x8a8580, roughness: 1 }),
  ember: new THREE.MeshStandardMaterial({ color: 0xff5a1a, emissive: 0xff3c00, emissiveIntensity: 2 }),
};

const sphere = new THREE.SphereGeometry(1, 48, 32);
function mesh(geo, mat, parent, pos = [0, 0, 0], scale = [1, 1, 1], rot = [0, 0, 0]) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(...pos); m.scale.set(...scale); m.rotation.set(...rot);
  m.castShadow = true; m.receiveShadow = true;
  parent.add(m);
  return m;
}
function group(parent, pos = [0, 0, 0]) { const g = new THREE.Group(); g.position.set(...pos); parent.add(g); return g; }

// ------------------------------------------------------------ build Gary
const byte = new THREE.Group();                 // root: walks around the stage
scene.add(byte);
const squash = group(byte);                      // squash & stretch on hops
const hips = group(squash, [0, 0.46, 0]);
const torso = group(hips);

// body: a chubby lathe, striped tee, dark collar, belt line
const bodyProfile = [[0.30, 0.0], [0.335, 0.12], [0.34, 0.28], [0.325, 0.44], [0.29, 0.56], [0.22, 0.64], [0.14, 0.69], [0.0, 0.70]]
  .map(([r, y]) => new THREE.Vector2(r, y));
const body = mesh(new THREE.LatheGeometry(bodyProfile, 48), M.shirt, torso, [0, 0, 0], [1, 1, 0.86]);
mesh(new THREE.TorusGeometry(0.145, 0.03, 12, 40), new THREE.MeshStandardMaterial({ color: 0x101c26, roughness: 0.9 }), torso, [0, 0.685, 0.0], [1, 1, 0.86], [Math.PI / 2, 0, 0]);
mesh(new THREE.CylinderGeometry(0.12, 0.13, 0.14, 24), M.skin, torso, [0, 0.72, 0.0]);          // neck
mesh(new THREE.CylinderGeometry(0.315, 0.30, 0.13, 48), M.jeans, torso, [0, 0.02, 0], [1, 1, 0.86]);
mesh(new THREE.TorusGeometry(0.31, 0.022, 10, 48), new THREE.MeshStandardMaterial({ color: 0x3b2a20, roughness: 0.6 }), torso, [0, 0.085, 0], [1, 1, 0.86], [Math.PI / 2, 0, 0]); // belt

// arms: shoulder + elbow pivots so they bend naturally
function arm(side) {                              // side: -1 = viewer's left (world -x), +1 = viewer's right
  const sh = group(torso, [0.30 * side, 0.58, 0]);
  mesh(sphere, M.shirt, sh, [0, 0.0, 0], [0.125, 0.12, 0.115]);                               // sleeve cap
  mesh(new THREE.CylinderGeometry(0.095, 0.085, 0.14, 20), M.shirt, sh, [0, -0.08, 0]);      // short sleeve
  const up = mesh(new THREE.CapsuleGeometry(0.068, 0.16, 8, 16), M.skin, sh, [0, -0.18, 0]);   // upper arm
  const el = group(sh, [0, -0.26, 0]);
  const fore = mesh(new THREE.CapsuleGeometry(0.062, 0.17, 8, 16), M.skin, el, [0, -0.1, 0]);    // forearm
  const hand = group(el, [0, -0.22, 0]);
  mesh(sphere, M.skin, hand, [0, -0.03, 0], [0.085, 0.095, 0.075]);                           // palm
  mesh(sphere, M.skin, hand, [-0.055 * side, 0.0, 0.045], [0.034, 0.05, 0.034]);             // thumb
  for (let i = 0; i < 3; i++) mesh(sphere, M.skin, hand, [(i - 1) * 0.045, -0.11, 0.01], [0.028, 0.035, 0.028]);  // finger bumps
  sh.rotation.z = 0.18 * side;
  return { sh, el, hand, side, up, fore };
}
const armN = arm(-1), armP = arm(1);              // armP holds the cigarette side

function leg(side) {
  const hp = group(hips, [0.135 * side, 0.0, 0]);
  mesh(new THREE.CapsuleGeometry(0.1, 0.13, 8, 16), M.jeans, hp, [0, -0.12, 0]);            // thigh
  const kn = group(hp, [0, -0.21, 0]);
  mesh(new THREE.CapsuleGeometry(0.088, 0.13, 8, 16), M.jeans, kn, [0, -0.08, 0]);          // shin
  const ft = group(kn, [0, -0.2, 0]);
  mesh(sphere, M.shoe, ft, [0, -0.0, 0.04], [0.115, 0.075, 0.165]);                           // sneaker body
  mesh(sphere, M.shoe, ft, [0, -0.01, 0.13], [0.1, 0.06, 0.09]);                              // toe cap

function tick() {

addEventListener("resize", resize);
resize();
requestAnimationFrame(tick);
</script>
