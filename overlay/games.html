<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gary's Games</title>
<style>
  /* OBS: Browser Source http://localhost:7777/games  (600 x 520). Buttons: http://localhost:7777/games/control */
  :root { --pink: #ff2fb4; --cyan: #29e6ff; --yellow: #ffe23d; --lime: #b6ff3b; --ink: #120a2a; --panel: rgba(22, 10, 52, .92); --text: #fff; --muted: #c9b8ff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; color: var(--text); font: 600 20px/1.25 "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  .card { font-weight: 600; font-size: 20px; width: 560px; margin: 16px; padding: 16px 18px 18px; background: var(--panel); border: 3px solid var(--cyan);
          box-shadow: 6px 6px 0 var(--pink), 0 0 30px rgba(41, 230, 255, .35); border-radius: 6px; transform-origin: top left;
          animation: pop .35s cubic-bezier(.2, 1.6, .4, 1); }
  @keyframes pop { from { transform: scale(.85); opacity: 0; } }
  .tag { display: inline-block; font: 900 15px/1 "Arial Black", Impact, sans-serif; letter-spacing: .08em; padding: 5px 9px;
         background: var(--yellow); color: var(--ink); transform: skew(-8deg); margin-bottom: 10px; }
  .tag.pink { background: var(--pink); color: #fff; }
  .tag.lime { background: var(--lime); }
  .q { font: 900 24px/1.2 "Arial Black", Impact, sans-serif; margin: 0 0 12px; text-shadow: 2px 2px 0 var(--pink); }
  .opt { position: relative; margin: 7px 0; padding: 8px 12px; border: 2px solid rgba(255,255,255,.18); border-radius: 4px; overflow: hidden; display: flex; gap: 10px; align-items: center; }
  .opt .bar { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, rgba(255,47,180,.55), rgba(41,230,255,.45)); transition: width .5s; z-index: 0; }
  .opt > span { position: relative; z-index: 1; }
  .opt .k { font: 900 18px "Arial Black", Impact, sans-serif; color: var(--yellow); min-width: 22px; }
  .opt .n { margin-left: auto; color: var(--muted); }
  .opt.win { border-color: var(--lime); box-shadow: 0 0 14px var(--lime); }
  .opt.win .k { color: var(--lime); }
  .opt.lose { opacity: .45; }
  .foot { display: flex; justify-content: space-between; margin-top: 10px; color: var(--muted); font-size: 16px; }
  .timer { color: var(--yellow); font-variant-numeric: tabular-nums; }
  .board div { display: flex; justify-content: space-between; padding: 4px 2px; border-bottom: 1px dashed rgba(255,255,255,.15); }
  .board div:first-child { color: var(--yellow); }
  .big { font: 900 34px/1.1 "Arial Black", Impact, sans-serif; color: var(--lime); text-shadow: 3px 3px 0 var(--pink); }
  #stack > * + * { margin-top: 0; }
  /* control page */
  body.control { overflow: auto; background: #0f0d1a; font-weight: 400; font-size: 14px; }
  .ctl { max-width: 900px; margin: 0 auto; padding: 16px; display: grid; gap: 12px; }
  .ctl h1 { font-size: 18px; margin: 0; }
  .ctl .box { background: #1a1730; border: 1px solid #2e2950; border-radius: 10px; padding: 12px; }
  .ctl label { font-size: 12px; color: #9b97b8; display: block; margin-bottom: 6px; }
  .ctl .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .ctl input { flex: 1; min-width: 120px; background: #0f0d1a; color: #ecebf5; border: 1px solid #2e2950; border-radius: 8px; padding: 9px 10px; font: inherit; }
  .ctl input.s { flex: 0 0 90px; min-width: 0; }
  .ctl button { background: #7c5cff; color: #fff; border: 0; border-radius: 8px; padding: 9px 14px; font: inherit; font-weight: 600; cursor: pointer; }
  .ctl button.g { background: transparent; border: 1px solid #2e2950; color: #ecebf5; }
  .ctl .hint { font-size: 12px; color: #9b97b8; margin-top: 6px; }
  .preview { display: flex; justify-content: center; background: repeating-conic-gradient(#1a1730 0 25%, #221e3d 0 50%) 0 0 / 24px 24px; border-radius: 10px; min-height: 80px; }
</style>
</head>
<body>
<div id="controls"></div>
<div id="stack"></div>
<script>
const CONTROL = location.pathname.endsWith("/control") || location.search.includes("control");
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let ws, state = {}, recv = 0, flash = null;
const send = o => ws && ws.readyState === 1 && ws.send(JSON.stringify(o));

function connect(delay = 1000) {
  ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/games/ws");
  ws.onopen = () => { delay = 1000; };
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.race_result) flash = { kind: "race", data: m.race_result, until: Date.now() + 15000 };
    if (m.show_board) flash = { kind: "board", until: Date.now() + 15000 };
    state = m; recv = Date.now(); render();
  };
  ws.onclose = () => setTimeout(() => connect(Math.min(delay * 1.5, 10000)), delay);
}

function left(sec) { const s = Math.max(0, sec - Math.floor((Date.now() - recv) / 1000)); return s + "s"; }

function opts(list, counts, mark, letters) {
  const total = (counts || []).reduce((a, b) => a + b, 0) || 1;
  return list.map((o, i) => {
    const n = counts ? counts[i] : null, pct = counts ? Math.round(100 * n / total) : 0;
    const cls = mark == null ? "" : (mark === i ? "win" : "lose");
    return `<div class="opt ${cls}"><div class="bar" style="width:${pct}%"></div><span class="k">${letters ? "ABCD"[i] : i + 1}</span><span>${esc(o)}</span>${counts ? `<span class="n">${n} · ${pct}%</span>` : ""}</div>`;
  }).join("");
}

function render() {
  const out = [];
  const s = state;
  if (s.trivia) {
    const t = s.trivia;
    if (t.phase === "asking" || t.phase === "reveal") {
      out.push(`<div class="card"><span class="tag pink">TRIVIA · Q${t.n + (t.phase === "reveal" ? 0 : 1)}/${t.rounds}${t.topic ? " · " + esc(t.topic).toUpperCase() : ""}</span>
        <p class="q">${esc(t.question)}</p>${opts(t.choices, null, t.phase === "reveal" ? t.answer : undefined, true)}
        <div class="foot"><span>${t.phase === "reveal" ? "Answer: " + "ABCD"[t.answer] : "Type A, B, C or D"} · ${t.answered} answered</span>${t.phase === "asking" ? `<span class="timer">${left(t.left)}</span>` : ""}</div></div>`);
    } else if (t.phase === "done" && t.scores.length) {
      out.push(`<div class="card"><span class="tag lime">TRIVIA CHAMP</span><div class="big">${esc(t.scores[0][0])}</div>
        <div class="board" style="margin-top:10px">${t.scores.map(([u, p]) => `<div><span>${esc(u)}</span><span>${p}</span></div>`).join("")}</div></div>`);
    } else if (t.phase === "loading" || t.phase === "ready") {
      out.push(`<div class="card"><span class="tag pink">TRIVIA${t.topic ? " · " + esc(t.topic).toUpperCase() : ""}</span><p class="q">Get ready… ${t.rounds} questions</p><div class="foot"><span>Answer with A, B, C or D in chat</span></div></div>`);
    }
  }
  if (s.poll) {
    const p = s.poll, best = Math.max(...p.counts);
    out.push(`<div class="card"><span class="tag">${p.closed ? "POLL RESULTS" : "CHAT POLL"}</span><p class="q">${esc(p.question)}</p>
      ${opts(p.options, p.counts, p.closed && best > 0 ? p.counts.indexOf(best) : undefined)}
      <div class="foot"><span>${p.closed ? p.counts.reduce((a, b) => a + b, 0) + " votes" : "Type the number to vote"}</span>${p.closed ? "" : `<span class="timer">${left(p.left)}</span>`}</div></div>`);
  }
  if (s.predict) {
    const p = s.predict;
    out.push(`<div class="card"><span class="tag pink">PREDICTION${p.locked ? " · LOCKED" : ""}</span><p class="q">${esc(p.question)}</p>
      ${p.options ? opts(p.options, p.counts) : `<div class="foot" style="margin:0"><span>Type <b>!pick name</b> to call it</span></div>`}
      <div class="foot"><span>${p.count} picks</span>${p.locked ? "" : `<span class="timer">${left(p.left)}</span>`}</div></div>`);
  }
  if (flash && Date.now() < flash.until) {
    if (flash.kind === "race" && flash.data.winner) {
      const d = flash.data;
      out.push(`<div class="card"><span class="tag lime">MARBLE RACE WINNER</span><div class="big">${esc(d.winner)}</div>
        <div class="foot"><span>${d.last ? "Last place: " + esc(d.last) : ""}</span><span>${d.called && d.called.length ? "Called it: " + d.called.map(esc).join(", ") : ""}</span></div></div>`);
    }
    if (flash.kind === "board" && s.board && s.board.length) {
      out.push(`<div class="card"><span class="tag">LEADERBOARD</span><div class="board">${s.board.map(([u, p]) => `<div><span>${esc(u)}</span><span>${p}</span></div>`).join("")}</div></div>`);
    }
  }
  const html = out.join("");
  if ($("#stack").dataset.html !== html) { $("#stack").innerHTML = html; $("#stack").dataset.html = html; }
}
setInterval(() => { document.querySelectorAll(".timer").length && render(); if (flash && Date.now() > flash.until) { flash = null; render(); } }, 1000);

if (CONTROL) {
  document.body.classList.add("control");
  $("#controls").innerHTML = `<div class="ctl">
    <div class="row"><h1>Gary's games &amp; features</h1><span style="flex:1"></span><a href="/control" style="color:#9b97b8">main control page</a></div>
    <div class="box"><label>Chat poll (leave options blank and Gary makes them up)</label>
      <div class="row"><input id="pq" placeholder="Which game next?"><input id="po" placeholder="Mario | Zelda | Tetris"><input class="s" id="ps" placeholder="90 s"><button data-c="poll">Start</button><button class="g" data-c="pollend">End now</button></div></div>
    <div class="box"><label>Trivia</label>
      <div class="row"><input id="tt" placeholder="Topic (blank = mixed)"><input class="s" id="tr" placeholder="3 qs"><button data-c="trivia">Start</button><button class="g" data-c="triviastop">Stop</button></div></div>
    <div class="box"><label>Prediction (blank options = Yes / No)</label>
      <div class="row"><input id="xq" placeholder="Will dum beat this boss?"><input id="xo" placeholder="Yes | No"><button data-c="predict">Open</button><button class="g" data-c="lock">Lock</button><button class="g" data-c="cancel">Cancel</button></div>
      <div class="row" style="margin-top:8px"><input id="xr" placeholder="What happened (option text or number)"><button data-c="resolve">Settle it</button></div></div>
    <div class="box"><label>Marble race</label>
      <div class="row"><button data-c="racestart">Race starting</button><input id="rw" placeholder="Winner"><input id="rl" placeholder="Last place (optional)"><button data-c="raceend">Race over</button></div>
      <div class="hint">Streamer.bot Fetch URL works too: /api/race?state=start and /api/race?state=end&amp;winner=NAME&amp;last=NAME</div></div>
    <div class="box"><label>Other</label>
      <div class="row"><button class="g" data-c="clip">Clip that</button><button class="g" data-c="glance">Look at the screen</button><button class="g" data-c="leaderboard">Leaderboard</button><button class="g" data-c="voice">Random voice effect</button><button data-c="recap">End-of-stream recap</button></div>
      <div class="row" style="margin-top:8px"><input id="ru" placeholder="Raider name"><input class="s" id="rv" placeholder="viewers"><input id="rg" placeholder="game they played (optional)"><button class="g" data-c="raid">Test a raid</button></div></div>
    <div class="box"><label>What the OBS overlay shows (add http://localhost:7777/games as a Browser Source, 600 x 520)</label><div class="preview"><div id="pv"></div></div></div>
  </div>`;
  const pv = $("#pv"); pv.appendChild($("#stack"));
  const v = id => $("#" + id).value.trim();
  const C = {
    poll: () => ({ cmd: "poll", question: v("pq"), options: v("po"), seconds: parseInt(v("ps")) || 0 }),
    pollend: () => ({ cmd: "poll", end: 1 }),
    trivia: () => ({ cmd: "trivia", topic: v("tt"), rounds: parseInt(v("tr")) || 0 }),
    triviastop: () => ({ cmd: "trivia", stop: 1 }),
    predict: () => ({ cmd: "predict", question: v("xq"), options: v("xo") }),
    lock: () => ({ cmd: "predict", lock: 1 }), cancel: () => ({ cmd: "predict", cancel: 1 }),
    resolve: () => ({ cmd: "predict", resolve: v("xr") }),
    racestart: () => ({ cmd: "race", state: "start" }),
    raceend: () => ({ cmd: "race", state: "end", winner: v("rw"), last: v("rl") }),
    clip: () => ({ cmd: "clip" }), glance: () => ({ cmd: "glance" }), leaderboard: () => ({ cmd: "leaderboard" }),
    voice: () => ({ cmd: "voice", effect: "random" }), recap: () => ({ cmd: "recap" }),
    raid: () => ({ cmd: "raid", user: v("ru") || "TestRaider", viewers: parseInt(v("rv")) || 12, game: v("rg") }),
  };
  document.querySelectorAll("[data-c]").forEach(b => b.onclick = () => send(C[b.dataset.c]()));
}
connect();
</script>
</body>
</html>
