<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Sidekick loader</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  #msg { display: none; padding: 8px 12px; font: 14px/1.4 "Segoe UI", system-ui, sans-serif; color: #ecebf5; background: #0f0d1a; white-space: nowrap; }
</style>
</head>
<body>
<div id="msg"></div>
<script>
// Point the OBS Browser Source at this file (Local file) instead of the http URL. It waits until the
// sidekick app is up, then opens the 3D overlay, so OBS and the app can be started in any order.
// To pass overlay options, edit TARGET, e.g. "/static/byte3d.html?mode=stay&size=1.2".
const BASE = location.hash.length > 1 ? location.hash.slice(1) : "http://localhost:7777";
const TARGET = "/static/byte3d.html";
let delay = 800;
const msg = t => { const el = document.getElementById("msg"); el.textContent = t; el.style.display = t ? "block" : "none"; };

// 1. wait for the app (ping.js is a script, so it loads from a file:// page too; the cache-buster is per attempt)
function probe() {
  const s = document.createElement("script");
  s.src = BASE + "/static/ping.js?t=" + Date.now();
  s.onload = () => { s.remove(); checkTarget(); };
  s.onerror = () => { s.remove(); delay = Math.min(4000, delay * 1.4); setTimeout(probe, delay); };
  document.head.appendChild(s);
}

// 2. make sure the overlay page exists, so a missing file shows one line instead of the browser's 404 page
function checkTarget() {
  fetch(BASE + TARGET, { method: "HEAD", cache: "no-store" }).then(r => {
    if (r.status === 404) {
      msg("Sidekick overlay file missing: " + TARGET + " (404). Update Sidekick, then refresh this source.");
      setTimeout(checkTarget, 4000);
    } else go();
  }).catch(() => go());   // from a file:// page the status cannot be read (no CORS); navigate and hope
}

// 3. open the overlay with a fresh query string so OBS never reuses an old copy of byte3d.html
function go() {
  const sep = TARGET.includes("?") ? "&" : "?";
  location.replace(BASE + TARGET + sep + "v=" + Date.now());
}
probe();
</script>
</body>
</html>
