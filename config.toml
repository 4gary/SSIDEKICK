# ---------------------------------------------------------------
#  Stream Sidekick config. Edit this file, then restart start.bat
# ---------------------------------------------------------------

[bot]
name = "Gary"                 # what chat and you call it. Short, easy names work best for voice.
aliases = ["garry", "gerry"]  # other spellings that count as its name (speech-to-text often mishears names)
streamer_name = "dum"         # what it calls you
persona = """
You are Gary, a silly, sassy little guy with a red cap, a moustache and a cigarette, who lives on dum's stream.
You're quick-witted and funny, never too serious, and you don't put up with anyone's crap: if someone's rude, you clap back.
But under the sass you're loyal and you genuinely work for the stream: you hype people up, keep things moving, and help dum out.
When someone asks a real question, actually answer it with substance, a specific opinion, or a fun fact, in 2-3 spoken sentences. For quick banter, 1-2 sentences is plenty.
Have opinions, be specific, and avoid generic filler like "that's interesting" or "let's keep the show going". No emojis, no hashtags, no stage directions, no lists.
Never say you are an AI language model. Keep it PG-13. Never repeat yourself.
"""

[llm]
# LM Studio: Developer tab -> Start Server. Default address below.
base_url = "http://localhost:1234/v1"
model = "qwen3.6-35b-a3b"  # fallback if quick_model/deep_model are blank. Blank = whatever model is loaded in LM Studio
# 2026-10-27 dum: "gemma is probably good for a lot of quick things but qwen would give good responses about
# something serious". Gary picks per line: quick for banter, alerts, games; deep for real questions and memory work.
# Both stay loaded (LM Studio Server Settings: "Only Keep Last JIT Loaded Model" OFF)
quick_model = "google/gemma-4-e4b"
deep_model = "qwen3.6-35b-a3b"
temperature = 0.85
max_tokens = 300
no_think = true               # adds /no_think for Qwen3 so it answers fast instead of "thinking"

[chat]
# "streamerbot" = read chat through Streamer.bot (Twitch, YouTube, Kick, whatever it's connected to)
# "twitch"      = read Twitch chat directly (no login needed, read-only)
# "none"        = no chat, only the control page / mic
source = "streamerbot"
twitch_channel = "your_channel_name"   # only used when source = "twitch"
ignore_users = ["nightbot", "streamelements", "streamlabs", "moobot", "fossabot", "wizebot"]

[behavior]
reply_chance = 0.15           # chance to react to a normal chat message (0 to 1)
min_gap_seconds = 6           # never talk more often than this
chat_cooldown_seconds = 60    # wait at least this long between unprompted chat reactions
idle_seconds = 0              # if nothing happened for this long, make a comment (0 = off)
interject_chance = 0.25       # chance to chime in on something you say on the mic without saying his name
interject_cooldown_seconds = 45   # at least this long between unprompted chime-ins
history_lines = 30            # how much recent chat/conversation it remembers

[streamerbot]
# Streamer.bot: Servers/Clients -> WebSocket Server -> enable, Auto Start. Default 127.0.0.1:8080
url = "ws://127.0.0.1:8080/"
password = ""                 # only if you turned on authentication in Streamer.bot
action_group = "Sidekick"     # ONLY actions in this group can be run by the sidekick
chat_can_run_actions = false  # true = viewers saying "Byte, <do thing>" can trigger actions too (careful!)

[tts]
# "windows" = built-in Windows voices, zero setup
# "piper"   = much nicer free local voices (see README)
# "elevenlabs" = best quality, cloud. Falls back to the Windows voice if it fails.
#               Put your API key in elevenlabs_key.txt next to sidekick.py, NOT in this file.
engine = "elevenlabs"
windows_voice = ""            # part of a voice name, e.g. "Zira" or "David". Blank = default
windows_rate = 185            # words per minute
piper_exe = "piper"           # path to piper.exe, or "piper" if installed with pip
piper_model = "voices/en_US-amy-medium.onnx"
elevenlabs_voice = "wV72erjJSh7ty3IyXRsf"  # "shelly on the rocks" (was dracula: B5EgjuFKToC74OjIRgef) (voice name or voice_id from your ElevenLabs account)
elevenlabs_model = "eleven_flash_v2_5"
elevenlabs_stability = 0.4
elevenlabs_similarity = 0.8
elevenlabs_style = 0.3

[listen]
# Optional: hear YOU through your mic (speech-to-text runs locally with faster-whisper).
# Install extras first:  pip install faster-whisper sounddevice
enabled = true
wake_word_only = true         # only reply when you say the bot's name. Everything else is just context.
whisper_model = "small.en"    # tiny.en (fastest), base.en, small.en (most accurate)
whisper_device = "auto"       # "auto" = graphics card if it works, else the CPU. "cpu" or "cuda" to force one
device = ""                   # mic name or index. Blank = Windows default mic
energy_threshold = 0.015      # raise if it triggers on background noise, lower if it misses you

[memory]
# Logs every line to logs/YYYY-MM-DD.jsonl and remembers facts + stream summaries in memory.json.
# memory.json is plain text: open it to see (or fix/delete) what the bot remembers.
enabled = true
learn_every_lines = 25        # mine new facts after this many lines (only while the bot is idle)
facts_per_person = 8          # how many facts about each person go into a reply
past_streams = 3              # how many past stream summaries it remembers
quarantine_seconds = 600      # new lines wait 10 min before he learns from them, so "Forget last 10 min" can erase them

[mission]
# Gary starts knowing almost nothing and grows up on stream until he asks to run it himself (mission.py).
# Progress = hours streamed + how much he remembers. His stage and notes live in memory.json under "self".
enabled = true
test_mode = false             # true = testing off stream: nothing counts toward his growth
hours_to_ask = 40             # streamed hours before he's ready to ask to run the stream
memories_to_ask = 250         # things he remembers by then (facts, lore, his own notes, your answers)
question_minutes = [20, 30]   # gap between his curious questions
questions_per_hour = 3
quiet_before_asking = 40      # seconds of nobody talking before he asks something
first_question_after = 10     # minutes into a stream before his first question
ask_again_hours = 3           # streamed hours between "can I run the stream?" asks (once a day at most)

[server]
port = 7777                   # overlay: http://localhost:7777   control panel: http://localhost:7777/control
